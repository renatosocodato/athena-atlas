name: Linux installed distributions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and declared test dependencies
        run: |
          python -c "import pathlib, subprocess, sys; p=next(pathlib.Path('dist').glob('*.whl')).resolve(); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(p)+'[test]'])"
          python -m pip check
      - name: Test installed wheel outside checkout
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" -q -p no:cacheprovider
          python -m athena_atlas example --output wheel_example
      - name: Install source distribution and run example
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -m athena_atlas example --output sdist_example

  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install delivered wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "import pathlib, subprocess, sys; p=next(pathlib.Path('dist').glob('*.whl')).resolve(); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(p)+'[test]'])"
      - name: Install independent R reference
        run: sudo apt-get update && sudo apt-get install -y r-base r-bioc-edger
      - name: Compare aggregation and edgeR adapter
        run: python integration/check_r_reference.py --output "$RUNNER_TEMP/atlas_reference"
